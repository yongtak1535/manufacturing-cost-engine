[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-cost-engine"
version = "0.1.0"
description = "Phase 1 rule engine for a virtual manufacturing cost-management dataset"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1"
]

[project.scripts]
cost-engine = "manufacturing_cost_engine.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
